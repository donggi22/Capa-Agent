services:
  # ── MariaDB ──
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: mes_db
      MYSQL_USER: mes_user
      MYSQL_PASSWORD: mes_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── vLLM: EXAONE-4.0-1.2B + LoRA v3 (로컬 GPU) ──
  llm-1.2b:
    build:
      context: .
      dockerfile: Dockerfile.llm-1.2b
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TORCHDYNAMO_DISABLE=1
    volumes:
      - ./EXAONE-4.0-1.2B:/models/EXAONE-4.0-1.2B:ro
      - ./exaone4-1.2b-lora-v3:/models/exaone4-1.2b-lora-v3:ro
    command:
      - --model=/models/EXAONE-4.0-1.2B
      - --served-model-name=EXAONE-4.0-1.2B
      - --enable-lora
      - --lora-modules=finetuned=/models/exaone4-1.2b-lora-v3
      - --dtype=bfloat16
      - --max-model-len=8192
      - --port=8080
      - --trust-remote-code
      - --gpu-memory-utilization=0.85
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Mock MES API ──
  mes-api:
    build:
      context: .
      dockerfile: Dockerfile.mes
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=mes_user
      - DB_PASS=mes_pass
      - DB_NAME=mes_db
    volumes:
      - ./mock_mes:/app/mock_mes
    command: ["uvicorn", "mock_mes.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── LangGraph CAPA Agent ──
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - LLM_API_URL=http://llm-1.2b:8080/v1
      - LLM_MODEL=EXAONE-4.0-1.2B
      - LLM_1B_API_URL=http://llm-1.2b:8080/v1
      - LLM_1B_MODEL=finetuned
      - MES_API_URL=http://mes-api:8001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=mes_user
      - DB_PASS=mes_pass
      - DB_NAME=mes_db
    volumes:
      - ./agent:/app/agent
      - ./api:/app/api
      - ./static:/app/static
      - ./trajectories:/app/trajectories
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      mes-api:
        condition: service_healthy
      db:
        condition: service_healthy
      llm-1.2b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mariadb_data:
