apiVersion: apps/v1
kind: Deployment
metadata:
  name: capa-agent
  namespace: capa-agent
  labels:
    app: capa-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capa-agent
  template:
    metadata:
      labels:
        app: capa-agent
    spec:
      containers:
        - name: capa-agent
          image: capa-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: capa-agent-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
